<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/jvision/dist

    <Directory /var/www/jvision/dist>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Garante que rotas do React (como /login, /dashboard) carreguem o index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    # Configuração do Proxy Reverso
    ProxyRequests Off
    ProxyPreserveHost On
    
    # Redireciona chamadas de API para o Backend
    ProxyPass /api http://localhost:3001/api
    ProxyPassReverse /api http://localhost:3001/api

    # Redireciona chamadas de Autenticação para o Backend (ESSENCIAL PARA LOGIN/CADASTRO)
    ProxyPass /auth http://localhost:3001/auth
    ProxyPassReverse /auth http://localhost:3001/auth

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
